}
function splitList(d){
  return '<div class="usage-split-table"><table><thead><tr>'+['rank','deckName','share','deckUses','inDeck'].map(function(k){return '<th scope="col">'+t(k)+'</th>'}).join('')+'</tr></thead><tbody>'+d.decks.map(function(x){

function splitBody(card){
  var state=splitCache.get(splitKey(card.cardId)),scope=t('metrics')[METRICS.indexOf(metric)]+' · '+(period==='month'?month.value.slice(0,4)+'-'+month.value.slice(4):t('periods')[PERIODS.indexOf(period)]);

function placeSplit(){
  var focused=splitDialog&&splitDialog.contains(document.activeElement)?document.activeElement:null,focusAttribute=focused&&['data-split-view','data-split-select','data-split-sector','data-split-close','data-split-retry','data-split-export','data-split-format'].find(function(key){return focused.hasAttribute(key)}),focusValue=focusAttribute&&focused.getAttribute(focusAttribute);

  var card=openSplit!=null&&data&&!data.error&&metric!=='deck'?(data.cards||[]).find(function(x){return x.cardId===openSplit}):null;
  if(!card){if(splitDialog){splitDialog.close();splitDialog.remove();splitDialog=null;document.body.classList.remove('usage-split-open')}return}
  if(!splitDialog){
    var dialog=document.createElement('dialog'),previousFocus=document.activeElement;splitDialog=dialog;dialog.id='usageSplit';dialog.className='usage-split-dialog';dialog.dataset.splitPanel='';dialog.setAttribute('aria-labelledby','usageSplitTitle');
    dialog.addEventListener('close',function(){if(splitDialog!==dialog)return;splitDialog=null;openSplit=null;splitSelection=null;dialog.remove();document.body.classList.remove('usage-split-open');document.querySelectorAll('[data-split]').forEach(function(b){b.setAttribute('aria-expanded','false');b.classList.remove('active')});if(previousFocus&&previousFocus.isConnected)previousFocus.focus({preventScroll:true})});
    dialog.addEventListener('click',function(e){if(e.target.closest('a[href]')&&e.button===0&&!e.ctrlKey&&!e.metaKey&&!e.shiftKey&&!e.altKey)rememberSplitReturn()});
    document.body.append(dialog);document.body.classList.add('usage-split-open');
  }

  splitDialog.querySelectorAll('[data-split-view]').forEach(function(b){b.onclick=function(){splitMode=b.dataset.splitView;try{localStorage.setItem('srvpro.usage.splitView',splitMode)}catch(e){}placeSplit()}});
  function select(key){splitSelection=key;var scroller=splitDialog.querySelector('.usage-split-content'),scroll=scroller.scrollTop;placeSplit();splitDialog.querySelector('.usage-split-content').scrollTop=scroll}
  splitDialog.querySelectorAll('[data-split-select]').forEach(function(b){b.onclick=function(){select(b.dataset.splitSelect)}});
  splitDialog.querySelectorAll('[data-split-sector][aria-disabled="false"]').forEach(function(p){p.onclick=function(){select(p.dataset.splitSector)};p.onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();select(p.dataset.splitSector)}}});
  var retry=splitDialog.querySelector('[data-split-retry]');if(retry)retry.onclick=function(){fetchSplit(card.cardId)};
  var exportButton=splitDialog.querySelector('[data-split-export]'),formatSelect=splitDialog.querySelector('[data-split-format]');
  if(exportButton)exportButton.onclick=function(){exportSplit(card)};if(formatSelect)formatSelect.onchange=function(){splitFormat=formatSelect.value};
  if(!splitDialog.open)splitDialog.showModal();
  if(focusAttribute){var target=Array.from(splitDialog.querySelectorAll('['+focusAttribute+']')).find(function(x){return x.getAttribute(focusAttribute)===focusValue});(target||splitDialog.querySelector('[data-split-close]')).focus({preventScroll:true})}
  if(splitReturnScroll!==null&&splitCache.get(splitKey(card.cardId))?.data){splitDialog.querySelector('.usage-split-content').scrollTop=splitReturnScroll;splitReturnScroll=null}
}
async function fetchSplit(id){
  var key=splitKey(id),epoch=splitEpoch;splitCache.set(key,{loading:true});placeSplit();
  try{var r=await fetch('/api/ladder/usage/cards?'+new URLSearchParams({view:'deck-distribution',metric:metric,cardId:String(id),period:period,month:month.value,lang:lang}).toString()),result=await r.json().catch(function(){return null});
    if(!r.ok||!result||!result.available||!result.card||Number(result.card.cardId)!==id||!Array.isArray(result.decks)){var failed=Error('split');failed.status=r.status;throw failed}
    if(epoch!==splitEpoch)return;splitCache.set(key,{data:result})}
  catch(e){if(epoch!==splitEpoch)return;splitCache.set(key,{error:({400:'splitInvalid',429:'splitBusy',503:'splitTimeout'})[e.status]||'splitFailed'})}
  placeSplit();
}
function bindSplit(){document.querySelectorAll('[data-split]').forEach(function(b){b.onclick=function(){var id=Number(b.dataset.split),state=splitCache.get(splitKey(id));openSplit=id;splitSelection=null;splitStatus='';if(!state||state.error)fetchSplit(id);else placeSplit()}})}
function render(){disposeImages();var grid=document.getElementById('usageGrid');grid.innerHTML='';grid.hidden=true;document.getElementById('usageTable').hidden=false;var views=document.getElementById('usageViews');views.hidden=metric==='deck';views.setAttribute('aria-label',t('displayMode'));views.querySelectorAll('button').forEach(function(button){var selected=button.dataset.usageView===view;button.classList.toggle('active',selected);button.setAttribute('aria-pressed',String(selected))});var head=document.getElementById('head'),body=document.getElementById('body'),pager=document.getElementById('pager'),coverage=document.getElementById('coverage'),cov=data&&data.coverage||{};coverage.textContent=t('coverage').replace('%v%',cov.validCardDecks||0).replace('%a%',cov.allDecks||0);var shareHint=document.getElementById('shareHint');shareHint.hidden=metric==='deck';shareHint.textContent=SrvproStatsExport.t('shareHint',lang);if(!data||data.error){head.innerHTML='';body.innerHTML='<tr><td class="empty-state">'+t(data?'failed':'loading')+'</td></tr>';pager.innerHTML='';return}if(metric==='deck'){head.innerHTML=['rank','deckName','deckCount','usage'].map(function(k){return '<th>'+t(k)+'</th>'}).join('');var rows=data&&data.decks||[];body.innerHTML=rows.length?rows.map(function(x){var name=esc(local(x.names)),link=x.deckTypeId===4095?name:'<a class="inline-link" href="/deck-detail.html?deckTypeId='+x.deckTypeId+'&period='+period+'&month='+month.value+(lang==='zh'?'':'&L='+lang)+'">'+name+'</a>';return '<tr><td>'+x.rank+'</td><td>'+link+'</td><td>'+x.count+'</td><td>'+(x.usageRate*100).toFixed(2)+'%</td></tr>'}).join(''):'<tr><td colspan="4" class="empty-state">'+t('none')+'</td></tr>';pager.innerHTML='';return}

async function load(){sync();var request=++loadEpoch;openSplit=null;placeSplit();splitCache.clear();splitEpoch++;data=null;render();var endpoint=metric==='deck'?'/api/ladder/usage/decks':'/api/ladder/usage/cards';try{var r=await fetch(endpoint+'?metric='+metric+'&period='+period+'&month='+month.value+'&page='+page+'&lang='+lang+'&t='+Date.now()),result=await r.json();if(request!==loadEpoch)return;if(!r.ok||result.error)throw Error();data=result;render();restoreSplitReturn()}catch(e){if(request!==loadEpoch)return;data={error:true,coverage:{}};render()}}
