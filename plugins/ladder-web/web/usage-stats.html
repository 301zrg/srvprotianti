<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>游戏王OCG201103天梯服务器 卡片与卡组使用率</title><link rel="stylesheet" href="/assets/common.css"></head><body>

<script src="/assets/site-shell.js"></script><script>
var I18N={

var METRICS=['monster','spell','trap','extra','side','deck'],PERIODS=['today','week','month','all'],q=new URLSearchParams(location.search),metric=METRICS.includes(q.get('metric'))?q.get('metric'):'monster',period=PERIODS.includes(q.get('period'))?q.get('period'):'month',page=Math.max(1,Number(q.get('page'))||1),lang=SrvproWeb.getLanguage(),data=null,month=document.getElementById('monthSelect');
function t(k){return SrvproWeb.t(I18N,k)}function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function local(n){return n&&(n[lang]||n.zh)||'—'}function nowMonth(){var p={};new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit'}).formatToParts(new Date()).forEach(function(x){p[x.type]=x.value});return p.year+p.month}
function fillMonths(){var selected=/^\d{6}$/.test(q.get('month')||'')?q.get('month'):nowMonth(),a=[],n=new Date();for(var i=0;i<24;i++){var d=new Date(n.getFullYear(),n.getMonth()-i,1),k=d.getFullYear()+String(d.getMonth()+1).padStart(2,'0');a.push(k)}if(!a.includes(selected))a.unshift(selected);month.innerHTML=a.map(function(k){return '<option value="'+k+'">'+k.slice(0,4)+'-'+k.slice(4)+'</option>'}).join('');month.value=selected}
function sync(){var u=new URL(location.href);u.searchParams.set('metric',metric);u.searchParams.set('period',period);u.searchParams.set('month',month.value);u.searchParams.set('page',page);history.replaceState(null,'',u)}
function controls(){document.getElementById('metricTabs').innerHTML=METRICS.map(function(x,i){return '<button data-m="'+x+'" class="'+(x===metric?'active':'')+'">'+t('metrics')[i]+'</button>'}).join('');document.getElementById('periodTabs').innerHTML=PERIODS.map(function(x,i){return '<button data-p="'+x+'" class="'+(x===period?'active':'')+'">'+t('periods')[i]+'</button>'}).join('');month.hidden=period!=='month';document.querySelectorAll('[data-m]').forEach(function(b){b.onclick=function(){metric=b.dataset.m;page=1;sync();controls();load()}});document.querySelectorAll('[data-p]').forEach(function(b){b.onclick=function(){period=b.dataset.p;page=1;sync();controls();load()}})}
function render(){var head=document.getElementById('head'),body=document.getElementById('body'),pager=document.getElementById('pager'),coverage=document.getElementById('coverage'),cov=data&&data.coverage||{};coverage.textContent=t('coverage').replace('%v%',cov.validCardDecks||0).replace('%a%',cov.allDecks||0);if(data&&data.error){head.innerHTML='';body.innerHTML='<tr><td class="empty-state">'+t('failed')+'</td></tr>';pager.innerHTML='';return}if(metric==='deck'){head.innerHTML=['rank','deckName','deckCount','usage'].map(function(k){return '<th>'+t(k)+'</th>'}).join('');var rows=data&&data.decks||[];body.innerHTML=rows.length?rows.map(function(x){var name=esc(local(x.names)),link=x.deckTypeId===4095?name:'<a class="inline-link" href="/deck-detail.html?deckTypeId='+x.deckTypeId+'&period='+period+'&month='+month.value+(lang==='zh'?'':'&L='+lang)+'">'+name+'</a>';return '<tr><td>'+x.rank+'</td><td>'+link+'</td><td>'+x.count+'</td><td>'+(x.usageRate*100).toFixed(2)+'%</td></tr>'}).join(''):'<tr><td colspan="4" class="empty-state">'+t('none')+'</td></tr>';pager.innerHTML='';return}
head.innerHTML=['rank','id','name','decks','usage','one','two','three'].map(function(k){return '<th>'+t(k)+'</th>'}).join('');var cards=data&&data.cards||[];body.innerHTML=cards.length?cards.map(function(x){var href='https://ygocdb.com/card/'+x.cardId;return '<tr><td>'+x.rank+'</td><td><a class="inline-link" target="_blank" rel="noopener" href="'+href+'">'+x.cardId+'</a></td><td><a class="inline-link" target="_blank" rel="noopener" href="'+href+'">'+esc(x.name)+'</a></td><td>'+x.deckCount+'</td><td>'+(x.usageRate*100).toFixed(2)+'%</td><td>'+x.copies1+'</td><td>'+x.copies2+'</td><td>'+x.copies3+'</td></tr>'}).join(''):'<tr><td colspan="8" class="empty-state">'+t('none')+'</td></tr>';var pages=Math.max(1,Math.ceil((data&&data.total||0)/(data&&data.pageSize||50)));pager.innerHTML='<button data-page="1" '+(page<=1?'disabled':'')+'>'+t('first')+'</button><button data-page="'+(page-1)+'" '+(page<=1?'disabled':'')+'>'+t('prev')+'</button><span>'+t('page').replace('%p%',page).replace('%t%',pages)+'</span><button data-page="'+(page+1)+'" '+(page>=pages?'disabled':'')+'>'+t('next')+'</button>';pager.querySelectorAll('[data-page]').forEach(function(b){b.onclick=function(){page=Number(b.dataset.page);sync();load()}})}
async function load(){sync();var endpoint=metric==='deck'?'/api/ladder/usage/decks':'/api/ladder/usage/cards';try{var r=await fetch(endpoint+'?metric='+metric+'&period='+period+'&month='+month.value+'&page='+page+'&lang='+lang+'&t='+Date.now());data=await r.json();if(!r.ok||data.error)throw Error();render()}catch(e){data={error:true,coverage:{}};render()}}
fillMonths();month.onchange=function(){page=1;sync();load()};document.getElementById('refresh').onclick=load;SrvproWeb.init({translations:I18N,onLanguageChange:function(code){lang=code;controls();render();load()}});controls();load();
</script></body></html>
