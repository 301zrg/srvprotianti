  .stats { display: flex; gap: 24px; margin: 10px 0 16px; font-size: 14px; flex-wrap: wrap; }

  .spectate-link { display: inline-flex; align-items: center; gap: 8px; min-height: 28px; border-radius: 4px; text-decoration: none; vertical-align: middle; }

  .spectate-badge { padding: 2px 6px; background: #24425d; border: 1px solid #416a8b; border-radius: 4px; font-size: 12px; color: #c2e1ff; }

  .room-copy { min-height: 28px; margin-left: 12px; padding: 3px 8px; background: #243447; border: 1px solid #3a5068; color: #9db8d0; font: inherit; line-height: 1.5; vertical-align: middle; }
  .room-copy:hover { background: #2d435a; color: #fff; }
  .room-copy:focus-visible, .spectate-link:focus-visible { outline: 2px solid #7ec4ff; outline-offset: 2px; }

    .room-name { padding-top: 2px; padding-bottom: 2px; }

<script src="/assets/web-client-config.js?v=20261009"></script><script src="/assets/site-shell.js?v=20261024-entry"></script>

    hint_disabled: 'Web版 YGOPro へのリンクは現在無効です。ルーム名をコピーしてローカルゲームから接続できます。自動更新はありません。「更新」または F5 をご利用ください。パスワードは表示されません。',

  },

    ladder_match: 'Ladder Match', random_single: 'Random Single', random_match: 'Random Match', random_tag: 'Random Tag', random_other: 'Other Random Mode', ai_battle: 'AI Battle', arena_room: 'Arena Room', tournament_room: 'Tournament Room', single_room: 'Single Room', match_room: 'Match Room', tag_room: 'Tag Room', unknown_room: 'Unknown Type'
  },
  ko: {
    title: '유희왕 OCG 201103 랭킹 서버 라이브 룸', rooms_total: '전체 룸', playing_now: '듀얼 중', players_online: '온라인 플레이어', update_time: '업데이트',
    refresh: '새로고침',
    th_roomname: '룸 이름', th_type: '종류', th_mode: '모드', th_players: '플레이어', th_status: '상태',
    hint: '시작된 방 이름을 클릭하면 새 탭에서 웹 관전이 열립니다. 비밀번호 방은 비밀번호 입력 후 접속하세요. 자동 새로고침은 없습니다. 「새로고침」 또는 F5를 사용하세요. 비밀번호는 표시하거나 링크에 넣지 않습니다.',
    hint_disabled: '웹 YGOPro 링크는 현재 비활성화되어 있습니다. 방 이름을 복사해 로컬 게임에서 접속할 수 있습니다. 자동 새로고침은 없으니 「새로고침」 또는 F5를 사용하세요. 비밀번호는 표시되지 않습니다.',
    watch_btn: '관전', watch_password: '관전 · 비밀번호', copy_short: '복사',
    waiting: '대기 중', waiting_match: '매칭 대기 중', copy_btn: '룸 이름 복사', copied: '복사됨:', copy_fail: '복사 실패', load_fail: '로드 실패',
    ladder_match: '랭크 매치(MT)', random_single: '랜덤(1판)', random_match: '랜덤(MT)', random_tag: '랜덤(2v2)', random_other: '기타 랜덤 모드', ai_battle: 'AI 대전', arena_room: '아레나 룸', tournament_room: '대회 룸', single_room: '싱글 룸', match_room: '매치 룸', tag_room: '2v2 룸', unknown_room: '알 수 없는 종류'
  }
};
var lang = SrvproWeb.getLanguage();
function t(key) { return SrvproWeb.t(I18N, key); }
if (typeof SrvproWeb.clientEnabled === 'function' && !SrvproWeb.clientEnabled()) {
  document.querySelector('.hint').setAttribute('data-i18n', 'hint_disabled');
}
function spectatorUrl(roomName, needsPassword) {
  try { return SrvproWeb.entryUrl('spectate', {room:roomName, autojoin:!needsPassword}).href; }
  catch (error) { return ''; }
}
const ROOM_TYPES = new Set(['ladder_match', 'random_single', 'random_match', 'random_tag', 'random_other',
  'ai_battle', 'arena_room', 'tournament_room', 'single_room', 'match_room', 'tag_room', 'unknown_room']);
function roomTypeKey(room) {
  if (ROOM_TYPES.has(room.roomtype)) return room.roomtype;
  // Older room APIs lack roomtype; keep their known random labels, then trust the duel mode.
  const name = typeof room.roomname === 'string' ? room.roomname : '';
  if (/^(?:M#)?TT,RANDOM#\d+$/.test(name)) return 'ladder_match';
  if (/^S,RANDOM#\d+$/.test(name)) return 'random_single';
  if (/^M,RANDOM#\d+$/.test(name)) return 'random_match';
  if (/^T,RANDOM#\d+$/.test(name)) return 'random_tag';
  if (/^AI[^#$]*#N?\d+$/i.test(name)) return 'ai_battle';
  return room.roommode === 0 ? 'single_room' : room.roommode === 1 ? 'match_room' :
    room.roommode === 2 ? 'tag_room' : 'unknown_room';
}
function friendlyName(room, type) {
  const label = t(type);
  const mode = typeof room.randommode === 'string' ? room.randommode.replace(/[\x00-\x1f\x7f]/g, '').slice(0, 32) : '';
  return type === 'random_other' && mode ? label + ' (' + mode + ')' : label;
}
function modeName(mode) {
  return mode === 0 ? 'SINGLE' : mode === 1 ? 'MATCH' : mode === 2 ? 'TAG' : 'UNKNOWN';
}
function escapeHtml(value) {
  return String(value == null ? '' : value).replace(/[&<>"']/g, function (character) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[character];
  });
}
async function refresh() {
  try {
    const res = await fetch('/api/public/rooms?t=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    const rooms = data.rooms || [];
    let players = 0, playing = 0;
    const tbody = document.getElementById('tbody');
    tbody.innerHTML = '';
    for (const r of rooms) {
      const isPlaying = /^Duel:\d+ (?:Turn:\d+|Siding)$/.test(r.istart || '');
      if (isPlaying) playing++;
      const names = (r.users || []).map(function (u) {
        const name = String(u.name || '').split('$')[0];
        if (!name || /\*{3,}/.test(name)) return escapeHtml(name);
        return '<a class="inline-link" href="/player-stats.html?player=' + encodeURIComponent(name) +
          (lang === 'zh' ? '' : '&L=' + encodeURIComponent(lang)) + '">' + escapeHtml(name) + '</a>';
      }).join('、') || '(' + escapeHtml(t('waiting')) + ')';
      players += (r.users || []).length;
      const tr = document.createElement('tr');
      const rawRoomName = typeof r.roomname === 'string' ? r.roomname : '';
      const roomName = rawRoomName ? rawRoomName.split('$')[0] : ('#' + r.roomid);
      const type = roomTypeKey(r);
      tr.dataset.roomName = roomName;
      tr.dataset.roomState = String(r.istart || '');
      tr.dataset.roomType = type;
      const dispType = friendlyName(r, type);
      const isLadder = type === 'ladder_match';
      const playersCell = (r.istart !== 'wait' || !isLadder) ? names : escapeHtml(t('waiting_match'));
      tr.innerHTML = '<td class="room-name">' + escapeHtml(roomName) + '</td>' +
        '<td>' + escapeHtml(dispType) + '</td>' +
        '<td>' + modeName(r.roommode) + '</td>' +
        '<td>' + playersCell + '</td>' +
        '<td class="' + (isPlaying ? 'playing' : 'waiting') + '">' + escapeHtml(r.istart) + '</td>';
      if (isLadder && r.istart === 'wait' && typeof SrvproWeb.createClientLink === 'function') {
        const matchLink = SrvproWeb.createClientLink('ladder', null, 'match');
        matchLink.className = 'spectate-badge';
        tr.firstElementChild.appendChild(matchLink);
      }
      if (isPlaying && rawRoomName && roomName) {
        const needsPassword = r.needpass === 'true' || r.needpass === true || r.roomname.includes('$');
        const href = spectatorUrl(roomName, needsPassword);
        if (href) {
          const link = SrvproWeb.createClientLink('spectate', {room:roomName, autojoin:!needsPassword});
          link.textContent = '';
          link.className = 'spectate-link';
          link.href = href;
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
          const label = needsPassword ? t('watch_password') : t('watch_btn');
          link.title = label;
          const name = document.createElement('span');
          name.textContent = roomName;
          const badge = document.createElement('span');
          badge.className = 'spectate-badge';
          badge.textContent = label;
          link.appendChild(name);
          link.appendChild(badge);
          tr.firstElementChild.replaceChildren(link);
        }
      }
      const copyButton = document.createElement('button');
      copyButton.className = 'room-copy';
      copyButton.textContent = t('copy_short');
      copyButton.title = t('copy_btn');
      copyButton.setAttribute('aria-label', t('copy_btn') + ': ' + roomName);
      copyButton.onclick = function () { copyRoomName(roomName); };
      tr.firstElementChild.appendChild(copyButton);
      tbody.appendChild(tr);
    }
    document.getElementById('sRooms').textContent = rooms.length;
    document.getElementById('sPlaying').textContent = playing;
    document.getElementById('sPlayers').textContent = players;
    document.getElementById('sTime').textContent = new Date().toLocaleTimeString(lang === 'zh' ? 'zh-CN' : lang);
  } catch (e) {
    document.getElementById('sTime').textContent = t('load_fail') + ': ' + e;
  }
}
function copyRoomName(roomName) {
    const temp = document.createElement('input');
    temp.value = roomName;
    document.body.appendChild(temp);
    temp.select();
    try {
        document.execCommand('copy');
        alert(t('copied') + roomName);
    } catch(err) {
        alert(t('copy_fail'));
    }
    document.body.removeChild(temp);
}
document.querySelectorAll('[data-page-action="refresh"]').forEach(function (button) { button.addEventListener('click', refresh); });
SrvproWeb.init({
  translations: I18N,
  onLanguageChange: function (code) { lang = code; refresh(); }
});
refresh();
</script>
