function t(k){return SrvproWeb.t(I18N,k)} function recentLimit(){return Number(data&&data.recentMatchLimit)||10} function countText(k){return t(k).replace(/%n%/g,recentLimit())} function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

function fillMonths(){var selected=validMonth(q.get('month'))||monthKey(),a=[],n=new Date();for(var i=0;i<24;i++){var d=new Date(n.getFullYear(),n.getMonth()-i,1),k=d.getFullYear()+String(d.getMonth()+1).padStart(2,'0');a.push(k)}if(!a.includes(selected))a.unshift(selected);month.innerHTML=a.map(function(k){return '<option value="'+k+'">'+k.slice(0,4)+'-'+k.slice(4)+'</option>'}).join('');month.value=selected}

function parseInput(){var raw=input.value.trim(),cut=raw.indexOf('$');player=(cut<0?raw:raw.slice(0,cut)).trim();password=cut<0?'':raw.slice(cut+1);input.value=player;page=1;sync();load()}
function pct(v){return (Number(v||0)*100).toFixed(2)+'%'} function localName(names){return names&&(names[lang]||names.zh)||'—'}

function statSection(title,x,detailPeriod){var values=[['rank',Number.isInteger(x.rank)?x.rank:t('unavailable'),null],['points',x.points,null],['wins',x.wins,'#73d6a3'],['losses',x.losses,'#ef837f'],['diff',x.diff,SrvproWeb.semanticColor(x.diff)],['rate',pct(x.winRate),SrvproWeb.rateColor(Number(x.winRate||0)*100)]];return '<section class="stats-section"><h3>'+title+'</h3><div class="stat-grid">'+values.map(function(v){return '<div class="stat-box"><small>'+t(v[0])+'</small><strong>'+(v[2]?colored(v[1],v[2]):esc(v[1]))+'</strong></div>'}).join('')+'</div>'+deckBreakdown(x,detailPeriod)+'</section>'}
function chart(points){if(!points.length)return '<div class="empty-state">'+t('noRecords')+'</div>';var vals=[points[0].pointsBefore].concat(points.map(function(x){return x.pointsAfter})),min=Math.min.apply(null,vals),max=Math.max.apply(null,vals);if(min===max){min--;max++}var coords=vals.map(function(v,i){return {x:35+i*(500/Math.max(1,vals.length-1)),y:185-(v-min)/(max-min)*145,v:v}});return '<div class="chart-wrap"><svg viewBox="0 0 570 220" role="img"><line class="chart-grid" x1="35" y1="185" x2="535" y2="185"/><polyline class="chart-line" points="'+coords.map(function(p){return p.x+','+p.y}).join(' ')+'"/>'+coords.map(function(p,i){var showLabel=coords.length<=11||i===0||i===coords.length-1||i%2===0;return '<circle class="chart-dot" cx="'+p.x+'" cy="'+p.y+'" r="4"><title>'+p.v+'</title></circle>'+(showLabel?'<text x="'+p.x+'" y="'+(p.y-9)+'" fill="#dce6f0" text-anchor="middle" font-size="11">'+p.v+'</text>':'')}).join('')+'</svg></div>'}
function bool(v){return v==null?t('unavailable'):(v?t('yes'):t('no'))} function dlButton(m,side,available){return available?'<div class="deck-actions deck-actions--table"><button type="button" data-download="'+Number(m.matchId)+'" data-side="'+side+'">'+t(side==='player'?'downloadMine':'downloadOpp')+'</button><button type="button" class="deck-web-open" data-open-deck="'+Number(m.matchId)+'" data-side="'+side+'">'+SrvproDeckWeb.label(side==='player'?'openMine':'openOpponent')+'</button></div>':t('unavailable')}
function deckLink(deckTypeId,names,detailPeriod){var name=esc(localName(names)),id=Number(deckTypeId),p=detailPeriod||'month';if(!Number.isInteger(id)||id<=0||id===4095)return name;return '<a class="inline-link" href="/deck-detail.html?deckTypeId='+id+'&period='+p+'&month='+encodeURIComponent(month.value)+(lang==='zh'?'':'&L='+encodeURIComponent(lang))+'">'+name+'</a>'}
function opponentButton(name){return name?'<button type="button" class="opponent-link" data-opponent="'+esc(name)+'">'+esc(name)+'</button>':'—'}
function render(){var root=document.getElementById('content'),toast=document.getElementById('toast');document.querySelector('.mode-tips').textContent=countText('modeTips');toast.hidden=true;if(!data){root.innerHTML='<div class="empty-state">'+t('blank')+'</div>';return}if(!data.found){root.innerHTML='<div class="empty-state">'+t('notFound')+'</div>';return}if(!data.authenticated){toast.textContent=t('publicToast');toast.hidden=false}var s=data.summary;var html='<section class="web-card"><div class="summary-title"><h2>'+esc(data.player)+'</h2><span class="muted">'+data.month.slice(0,4)+'-'+data.month.slice(4)+'</span></div>'+statSection(t('total'),s.total,'all')+statSection(t('monthly'),s.month,'month')+'<h3 class="chart-title">'+countText('chart')+'</h3>'+chart(data.chart||[])+'</section>';
html+='<section class="web-card"><h2>'+t('history')+'</h2><div class="table-wrap"><table><thead><tr>'+['time','rps','first','result','score','delta','afterPoints','deck','opponent','oppDeck','oppDelta','oppAfterPoints','downloads'].map(function(k){return '<th>'+t(k)+'</th>'}).join('')+'</tr></thead><tbody>';
if(!data.matches.length)html+='<tr><td colspan="13" class="empty-state">'+t('noRecords')+'</td></tr>';else data.matches.forEach(function(m){var result=m.won==null?t('unavailable'):colored(m.won?t('win'):t('lose'),m.won?'#73d6a3':'#ef837f');html+='<tr><td>'+esc(m.settledAt?new Date(m.settledAt).toLocaleString():'—')+'</td><td>'+bool(m.rpsWon)+'</td><td>'+bool(m.g1First)+'</td><td>'+result+'</td><td>'+(m.score||t('unavailable'))+'</td><td>'+delta(m.pointsDelta)+'</td><td>'+m.pointsAfter+'</td><td>'+deckLink(m.deckTypeId,m.deckNames)+'</td><td>'+opponentButton(m.opponent)+'</td><td>'+deckLink(m.opponentDeckTypeId,m.opponentDeckNames)+'</td><td>'+delta(m.opponentPointsDelta)+'</td><td>'+m.opponentPointsAfter+'</td><td>'+dlButton(m,'player',m.playerDeckAvailable)+' '+dlButton(m,'opponent',m.opponentDeckAvailable)+'</td></tr>'});
html+='</tbody></table></div>';var pages=Math.max(1,Math.ceil(data.total/data.pageSize));html+='<div class="web-pagination"><button data-page="1" '+(page<=1?'disabled':'')+'>'+t('firstPage')+'</button><button data-page="'+(page-1)+'" '+(page<=1?'disabled':'')+'>'+t('prev')+'</button><span>'+t('page').replace('%p%',page).replace('%t%',pages).replace('%n%',data.total)+'</span><button data-page="'+(page+1)+'" '+(page>=pages?'disabled':'')+'>'+t('next')+'</button></div></section>';root.innerHTML=html;
root.querySelectorAll('[data-page]').forEach(function(b){b.onclick=function(){page=Number(b.dataset.page);sync();load()}});root.querySelectorAll('[data-download]').forEach(function(b){b.onclick=function(){downloadDeck(Number(b.dataset.download),b.dataset.side)}});root.querySelectorAll('[data-open-deck]').forEach(function(b){b.onclick=function(){openPlayerDeck(b,Number(b.dataset.openDeck),b.dataset.side)}});root.querySelectorAll('[data-opponent]').forEach(function(b){b.onclick=function(){player=b.dataset.opponent;password='';page=1;input.value=player;sync();load()}})}
async function load(){if(!player){data=null;render();return}sync();try{var r=await fetch('/api/ladder/player',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({player:player,password:password,month:month.value,page:page})});if(!r.ok)throw Error(r.status);data=await r.json();render()}catch(e){document.getElementById('content').innerHTML='<div class="empty-state">'+t('failed')+'</div>'}}
function openPlayerDeck(button,matchId,side){
  // Freeze this request: switching the queried player must not change its identity.
  var body=JSON.stringify({player:player,password:password,matchId:matchId,side:side});
  var record=(data&&data.matches||[]).find(function(m){return Number(m.matchId)===matchId});
  var name=(side==='player'?player:(record&&record.opponent||'opponent'))+'-'+matchId+'-'+side;
  SrvproDeckWeb.openAuthorized(button,function(signal){
    return fetch('/api/ladder/player/deck',{method:'POST',headers:{'Content-Type':'application/json'},body:body,signal:signal});
  },name);
}
async function downloadDeck(matchId,side){var r=await fetch('/api/ladder/player/deck',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({player:player,password:password,matchId:matchId,side:side})});if(!r.ok)return;var blob=await r.blob(),a=document.createElement('a'),safe=(player||'deck').replace(/[<>:"/\\|?*\x00-\x1f]/g,'_').slice(0,48);a.href=URL.createObjectURL(blob);a.download=safe+'-'+matchId+'-'+side+'.ydk';a.click();setTimeout(function(){URL.revokeObjectURL(a.href)},1000)}
fillMonths();document.getElementById('searchButton').onclick=parseInput;document.getElementById('refreshButton').onclick=load;month.onchange=function(){page=1;sync();load()};input.onkeydown=function(e){if(e.key==='Enter')parseInput()};SrvproWeb.init({translations:I18N,onLanguageChange:function(code){lang=code;render()}});if(player)load();
