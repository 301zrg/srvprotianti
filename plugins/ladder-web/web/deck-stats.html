<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SRVPro 卡组胜率</title>
  <style>
    body { font-family: "Microsoft YaHei", sans-serif; background:#16202b; color:#dce6f0; margin:0; padding:20px; }
    h1 { font-size:20px; color:#7ec4ff; margin-bottom:12px; }
    .nav a { color:#7ec4ff; text-decoration:none; margin-right:12px; }
    .langbtns { position:fixed; top:10px; right:12px; z-index:2; }
    .lbtn-main { background:#3a5575; color:#fff; border:0; padding:8px 12px; cursor:pointer; }
    .lang-menu { display:none; position:absolute; right:0; top:calc(100% + 6px); background:#243447; padding:6px; }
    .lang-menu.open { display:block; }
    .lang-menu .lbtn { display:block; width:100%; background:transparent; color:#dce6f0; border:0; padding:8px 12px; cursor:pointer; }
    .lang-menu .active { background:#2f5c86; }
    .controls, .tabs { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:14px 0; }
    label { font-size:13px; color:#9db8d0; }
    select { background:#243447; color:#dce6f0; border:1px solid #2c3e50; padding:6px 10px; }
    button { background:#2f5c86; color:#fff; border:none; padding:7px 14px; cursor:pointer; }
    /* 按钮点击态 */
    .tabs button.active {
      background: #7ec4ff;
      color: #16202b;
      font-weight: 600;
      box-shadow: 0 0 0 1px #7ec4ff;
    }
    table { width:100%; border-collapse:collapse; background:#1d2a38; font-size:13px; }
    th, td { border-bottom:1px solid #2c3e50; padding:8px 10px; text-align:left; white-space:nowrap; }
    th { background:#243447; color:#9db8d0; }
    .small { color:#6c8299; font-size:12px; }
    /* 提示行样式 */
    .hint {
      font-size: 13px;
      color: #9db8d0;
      margin: 10px 0 4px 0;
      padding: 6px 10px;
      background: #1d2a38;
      border-left: 3px solid #7ec4ff;
      border-radius: 3px;
    }
    /* 数值颜色类 - 动态内联设置颜色，但保留一个基础 */
    .val-colored {
      font-weight: 500;
    }
  </style>
</head>
<body>
  <h1 data-i18n="title">SRVPro 卡组胜率</h1>
  <div class="langbtns"><button class="lbtn-main" onclick="toggleLangMenu(event)">🌐 <span id="langLabel">中文</span></button><div class="lang-menu" id="langMenu"><button class="lbtn" data-lang="zh" onclick="switchLang('zh')">中文</button><button class="lbtn" data-lang="ja" onclick="switchLang('ja')">日本語</button><button class="lbtn" data-lang="en" onclick="switchLang('en')">English</button><button class="lbtn" data-lang="ko" onclick="switchLang('ko')">한국어</button></div></div>
  <div class="nav">
    <a href="intro.html" data-nav="intro" data-i18n="nav_intro">使用介绍</a>
    <a href="rooms.html" data-nav="rooms" data-i18n="nav_rooms">房间列表</a>
    <a href="replays.html" data-nav="replays" data-i18n="nav_replays">录像下载</a>
    <a href="ladder.html" data-nav="ladder" data-i18n="nav_ladder">天梯排行</a>
    <a href="deck-stats.html" data-nav="deck" data-i18n="nav_deck_stats">卡组胜率</a>
  </div>
  <div class="controls">
    <label for="monthSelect" data-i18n="month">月份</label>
    <select id="monthSelect"></select>
    <button onclick="loadStats()" data-i18n="refresh">刷新</button>
  </div>
  <div class="tabs" id="metricTabs"></div>
  <!-- 新增提示行 -->
  <div class="hint" id="hintRow" data-i18n="hint"></div>
  <div class="small" id="summary">加载中...</div>
  <div style="overflow-x:auto; margin-top:12px;">
    <table>
      <thead>
        <tr id="thead"></tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
<script>
var I18N={
  zh:{
    title:'SRVPro 卡组胜率',
    nav_intro:'使用介绍',nav_rooms:'房间列表',nav_replays:'录像下载',nav_ladder:'天梯排行',nav_deck_stats:'卡组胜率',
    month:'月份',refresh:'刷新',all:'全部',insufficient:'数据不足',no_data:'暂无数据',loading:'正在加载',
    summary:'已统计 %n% 个卡组 / %m%',
    hint:'显示的胜率为 左边的卡组 VS 上边的卡组',
    metrics:['m局综合胜率','m局先攻胜率','m局后攻胜率','单局综合胜率','单局先攻胜率','单局后攻胜率','主牌局单局综合胜率','主牌局单局先攻胜率','主牌局单局后攻胜率','备牌局单局综合胜率','备牌局单局先攻胜率','备牌局单局后攻胜率']
  },
  ja:{
    title:'SRVPro デッキ勝率',
    nav_intro:'使用説明',nav_rooms:'ルーム一覧',nav_replays:'リプレイ',nav_ladder:'ランキング',nav_deck_stats:'デッキ勝率',
    month:'月',refresh:'更新',all:'全体',insufficient:'データ不足',no_data:'データなし',loading:'読み込み中',
    summary:'%n% デッキ / %m%',
    hint:'表示されている勝率は 左のデッキ VS 上のデッキ',
    metrics:['マッチ総合','マッチ先攻','マッチ後攻','ゲーム総合','ゲーム先攻','ゲーム後攻','メイン総合','メイン先攻','メイン後攻','サイド総合','サイド先攻','サイド後攻']
  },
  en:{
    title:'SRVPro Deck Win Rates',
    nav_intro:'Usage Guide',nav_rooms:'Rooms',nav_replays:'Replays',nav_ladder:'Ladder',nav_deck_stats:'Deck Rates',
    month:'Month',refresh:'Refresh',all:'All',insufficient:'Insufficient data',no_data:'No data',loading:'Loading',
    summary:'%n% decks / %m%',
    hint:'Displayed win rate: Left deck VS Top deck',
    metrics:['Match overall','Match first','Match second','Game overall','Game first','Game second','Main overall','Main first','Main second','Side overall','Side first','Side second']
  },
  ko:{
    title:'SRVPro 덱 승률',
    nav_intro:'사용 가이드',nav_rooms:'룸 목록',nav_replays:'리플레이',nav_ladder:'랭킹',nav_deck_stats:'덱 승률',
    month:'월',refresh:'새로고침',all:'전체',insufficient:'데이터 부족',no_data:'데이터 없음',loading:'로드 중',
    summary:'%n% 덱 / %m%',
    hint:'표시된 승률은 왼쪽 덱 VS 위쪽 덱',
    metrics:['매치 종합','매치 선공','매치 후공','게임 종합','게임 선공','게임 후공','메인 종합','메인 선공','메인 후공','사이드 종합','사이드 선공','사이드 후공']
  }
};
var lang='zh', data=null, metric=0, monthSelect=document.getElementById('monthSelect');
var q=new URLSearchParams(location.search);
if(q.get('L')==='ja'||q.has('jp'))lang='ja';else if(q.get('L')==='en'||q.has('en'))lang='en';else if(q.get('L')==='ko'||q.has('kr'))lang='ko';

function t(k){return (I18N[lang]&&I18N[lang][k])||I18N.zh[k]||k;}
function toggleLangMenu(e){e.stopPropagation();document.getElementById('langMenu').classList.toggle('open');}
document.addEventListener('click',function(e){if(!document.getElementById('langMenu').contains(e.target))document.getElementById('langMenu').classList.remove('open');});

function switchLang(code){
  lang=code;
  var u=new URL(location.href);
  u.searchParams.delete('L');u.searchParams.delete('jp');u.searchParams.delete('en');u.searchParams.delete('kr');
  if(code!=='zh')u.searchParams.set('L',code);
  history.replaceState(null,'',u);
  applyLang();
  render();
}

function applyLang(){
  document.documentElement.lang=lang==='zh'?'zh-CN':lang;
  document.title=t('title');
  document.getElementById('langLabel').textContent={zh:'中文',ja:'日本語',en:'English',ko:'한국어'}[lang];
  document.querySelectorAll('[data-i18n]').forEach(function(e){
    var key = e.getAttribute('data-i18n');
    if (key === 'hint') {
      e.textContent = t('hint');
    } else {
      e.textContent=t(key);
    }
  });
  document.querySelectorAll('[data-nav]').forEach(function(e){
    var u=new URL(e.getAttribute('href'),location.href);
    u.searchParams.delete('L');
    if(lang!=='zh')u.searchParams.set('L',lang);
    e.href=u.pathname.split('/').pop()+u.search;
  });
  // 渲染 tabs 并高亮当前 metric
  document.getElementById('metricTabs').innerHTML=t('metrics').map(function(x,i){
    return '<button class="'+(i===metric?'active':'')+'" onclick="setMetric('+i+')">'+x+'</button>';
  }).join('');
}

function months(){
  var a=[],n=new Date();
  for(var i=0;i<12;i++){
    var d=new Date(n.getFullYear(),n.getMonth()-i,1);
    a.push(d.getFullYear()+String(d.getMonth()+1).padStart(2,'0'));
  }
  monthSelect.innerHTML=a.map(function(m){return '<option value="'+m+'">'+m.slice(0,4)+'-'+m.slice(4)+'</option>';}).join('');
}

function setMetric(i){
  metric=i;
  applyLang(); // 重新渲染 tabs 高亮
  render();
}

// 核心：根据胜率计算颜色
function getWinRateColor(rate) {
  // rate 是 0-100 的数字，或 null（数据不足）
  if (rate === null || isNaN(rate)) return '#dce6f0'; // 默认白

  var r = Math.round(rate * 10) / 10; // 保留一位小数
  if (r === 50) return '#dce6f0'; // 50% 白色

  var intensity = Math.min(Math.abs(r - 50) / 50, 1); // 0~1

  if (r > 50) {
    // 偏绿：从白色 #dce6f0 到亮绿 #6fcf97 (或 #8bc34a)
    // 白色: #dce6f0 -> 绿: #6fcf97
    var start = {r:220, g:230, b:240}; // #dce6f0
    var end   = {r:111, g:207, b:151}; // #6fcf97
    var rr = Math.round(start.r + (end.r - start.r) * intensity);
    var gg = Math.round(start.g + (end.g - start.g) * intensity);
    var bb = Math.round(start.b + (end.b - start.b) * intensity);
    return 'rgb(' + rr + ',' + gg + ',' + bb + ')';
  } else {
    // 偏红：白色 #dce6f0 -> 红 #e57373 或 #ef5350
    var start = {r:220, g:230, b:240};
    var end   = {r:239, g:83, b:80};  // #ef5350
    var rr = Math.round(start.r + (end.r - start.r) * intensity);
    var gg = Math.round(start.g + (end.g - start.g) * intensity);
    var bb = Math.round(start.b + (end.b - start.b) * intensity);
    return 'rgb(' + rr + ',' + gg + ',' + bb + ')';
  }
}

function value(item){
  var map=[
    ['matches','matchWins'],
    ['firstMatches','firstWins'],
    ['secondMatches','secondWins'],
    ['games','gameWins'],
    ['firstGames','firstGameWins'],
    ['secondGames','secondGameWins'],
    ['mainGames','mainGameWins'],
    ['mainFirstGames','mainFirstGameWins'],
    ['mainSecondGames','mainSecondGameWins'],
    ['sideGames','sideGameWins'],
    ['sideFirstGames','sideFirstGameWins'],
    ['sideSecondGames','sideSecondGameWins']
  ];
  var p=map[metric];
  var n=Number(item&&item[p[0]]||0);
  var w=Number(item&&item[p[1]]||0);
  if (!n) {
    return '<span class="insufficient">'+t('insufficient')+'</span>';
  }
  var rate = (w/n)*100;
  var rateStr = rate.toFixed(1) + '%';
  var color = getWinRateColor(rate);
  return '<span class="val-colored" style="color:'+color+';">'+rateStr+'</span>';
}

function render(){
  if(!data||!data.decks||!data.decks.length){
    document.getElementById('thead').innerHTML='';
    document.getElementById('tbody').innerHTML='<tr><td>'+t('no_data')+'</td></tr>';
    return;
  }
  var decks=data.decks, stats=data.stats||{};
  document.getElementById('thead').innerHTML='<tr><th>'+t('nav_deck_stats')+'</th>'+decks.map(function(d){
    return '<th>'+((d.name&&d.name[lang])||d.name.zh)+'</th>';
  }).join('')+'<th>'+t('all')+'</th></tr>';
  document.getElementById('tbody').innerHTML=decks.map(function(op){
    var cells=decks.map(function(subject){
      return '<td>'+value(stats[op.id+'::'+subject.id])+'</td>';
    }).join('');
    var total=stats[op.id+'::all']||{};
    return '<tr><th>'+((op.name&&op.name[lang])||op.name.zh)+'</th>'+cells+'<td>'+value(total)+'</td></tr>';
  }).join('');
}

async function loadStats(){
  document.getElementById('summary').textContent=t('loading');
  try{
    var r=await fetch('/api/ladder-deck-stats?month='+encodeURIComponent(monthSelect.value));
    data=await r.json();
    document.getElementById('summary').textContent=t('summary').replace('%n%',data.decks?data.decks.length:0).replace('%m%',monthSelect.value);
    render();
  }catch(e){
    data=null;
    document.getElementById('summary').textContent=t('no_data');
    render();
  }
}

months();
applyLang();
loadStats();
</script>
</body>
</html>
