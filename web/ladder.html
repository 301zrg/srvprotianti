<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SRVPro 天梯排行</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; background: #16202b; color: #dce6f0; margin: 0; padding: 20px; }
  h1 { font-size: 20px; color: #7ec4ff; padding-right: 130px; margin: 0 0 6px 0; }
  .nav a { color: #7ec4ff; text-decoration: none; margin-right: 12px; }
  .nav { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
  .tabs { margin: 12px 0; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .tabs .btn-group { display: flex; flex-wrap: wrap; gap: 6px; }
  .tabs button { background: #243447; color: #9db8d0; border: none; padding: 8px 18px; cursor: pointer; font-size: 13px; border-radius: 4px; transition: .2s; }
  .tabs button.active { background: #2f5c86; color: #fff; }
  .tabs .right-group { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-left: auto; }
  .tabs .right-group select { background: #243447; color: #dce6f0; border: 1px solid #2c3e50; padding: 6px 10px; font-size: 13px; border-radius: 4px; }
  .tabs .right-group button { background: #2f5c86; color: #fff; padding: 8px 18px; }
  .tabs .right-group button.outline { background: #243447; color: #9db8d0; }
  table { width: 100%; border-collapse: collapse; background: #1d2a38; font-size: 13px; min-width: 560px; }
  .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  th, td { padding: 8px 10px; border-bottom: 1px solid #2c3e50; text-align: left; white-space: nowrap; }
  th { background: #243447; color: #9db8d0; }
  th.ranking-basis, td.ranking-basis { background: #355d58; color: #b8f2d0; font-weight: bold; }
  th.ranking-basis { box-shadow: inset 0 -2px 0 #73d6a3; }
  tr.top1 td { color: #ffd875; font-weight: bold; }
  tr.top2 td { color: #d8d8d8; font-weight: bold; }
  tr.top3 td { color: #e0a06a; font-weight: bold; }
  .hint { color: #6c8299; font-size: 12px; margin-top: 8px; }
  .langbtns { position: fixed; top: 10px; right: 12px; z-index: 100; }
  .lbtn-main { background: #3a5575; color: #fff; border: none; padding: 10px 16px; cursor: pointer; font-size: 14px; border-radius: 6px; display: flex; align-items: center; gap: 6px; }
  .lang-menu { display: none; position: absolute; right: 0; top: calc(100% + 6px); background: #243447; border: 1px solid #2c3e50; border-radius: 8px; padding: 6px; min-width: 120px; box-shadow: 0 4px 16px rgba(0,0,0,.4); }
  .lang-menu.open { display: block; }
  .lang-menu .lbtn { display: block; width: 100%; text-align: center; background: transparent; color: #dce6f0; border: none; padding: 9px 12px; margin: 2px 0; cursor: pointer; font-size: 14px; border-radius: 5px; }
  .lang-menu .lbtn.active { background: #2f5c86; color: #fff; }
  .privacy-hint { color: #6c8299; font-size: 12px; margin-top: 6px; padding-bottom: 10px; border-bottom: 1px solid #2c3e50; }
  .search-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 6px 0 8px 0; }
  .search-row input { background: #243447; color: #dce6f0; border: 1px solid #2c3e50; padding: 6px 10px; font-size: 13px; flex: 1 1 180px; min-width: 120px; border-radius: 4px; }
  .search-row button { background: #2f5c86; color: #fff; border: none; padding: 6px 14px; cursor: pointer; font-size: 13px; border-radius: 4px; }
  .search-row button.outline { background: #243447; color: #9db8d0; }
  .pagination { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 12px; font-size: 13px; }
  .pagination button { background: #243447; color: #9db8d0; border: none; padding: 6px 14px; cursor: pointer; border-radius: 4px; }
  .pagination button.primary { background: #2f5c86; color: #fff; }
  .pagination span { margin: 0 6px; color: #9db8d0; }
  @media (max-width: 640px) {
    body { padding: 12px; }
    h1 { font-size: 16px; padding-right: 84px; }
    .lbtn-main { padding: 7px 12px; font-size: 13px; }
    th, td { padding: 6px 8px; }
    .tabs { flex-direction: column; align-items: stretch; gap: 6px; }
    .tabs .btn-group { justify-content: center; }
    .tabs .right-group { margin-left: 0; justify-content: center; }
    .tabs .right-group select { width: 100%; max-width: 160px; }
    .search-row input { flex: 1 1 140px; }
  }
</style>
</head>
<body>
<h1 data-i18n="title">SRVPro 天梯排行</h1>
<div class="langbtns">
  <button class="lbtn-main" onclick="toggleLangMenu(event)">🌐 <span id="langLabel">中文</span></button>
  <div class="lang-menu" id="langMenu">
    <button class="lbtn" data-lang="zh" onclick="switchLang('zh')">中文</button>
    <button class="lbtn" data-lang="ja" onclick="switchLang('ja')">日本語</button>
    <button class="lbtn" data-lang="en" onclick="switchLang('en')">English</button>
    <button class="lbtn" data-lang="ko" onclick="switchLang('ko')">한국어</button>
  </div>
</div>
<div class="nav">
  <a href="intro.html" data-i18n="nav_intro">使用介绍</a><a href="rooms.html" data-i18n="nav_rooms">房间列表</a><a href="replays.html" data-i18n="nav_replays">录像下载</a><a href="ladder.html" data-i18n="nav_ladder">天梯排行</a><a href="deck-stats.html" data-i18n="nav_deck_stats">卡组胜率</a>
</div>
<div class="search-row">
  <input id="searchInput" data-i18n-ph="search_ph" placeholder="输入玩家 ID 搜索其战绩" />
  <button onclick="doSearch()" data-i18n="search">搜索</button>
  <button class="outline" onclick="clearSearch()" data-i18n="clear">清空</button>
</div>
<div class="tabs">
  <div class="btn-group">
    <button id="tabTotal" class="active" data-i18n="tab_total">总战绩</button>
    <button id="tabMonth" data-i18n="tab_month">当月战绩</button>
  </div>
  <div class="right-group">
    <label for="monthSelect" style="color:#9db8d0; font-size:13px;" data-i18n="month_label">月份</label>
    <select id="monthSelect"></select>
    <button onclick="refresh()" data-i18n="refresh">手动刷新</button>
  </div>
</div>
<div class="privacy-hint" data-i18n="privacy_hint">排名后30%的玩家ID将在总榜上隐藏</div>
<div class="table-wrap">
<table>
  <thead><tr><th data-i18n="th_rank">排名</th><th data-i18n="th_player">玩家</th><th data-ranking-column="totalPoints" data-i18n="th_total_points">总等级分</th><th data-ranking-column="monthPoints" data-i18n="th_month_points">月等级分</th><th data-i18n="th_win">胜</th><th data-i18n="th_lose">负</th><th data-ranking-column="diff" data-i18n="th_diff">胜负差</th><th data-ranking-column="winRate" data-i18n="th_winrate">胜率</th></tr></thead>
  <tbody id="tbody"></tbody>
</table>
</div>
<div class="pagination">
  <button id="btnPrev" onclick="goPage(currentPage - 1)" data-i18n="prev">上一页</button>
  <span id="pageInfo" style="margin:0 6px; color:#9db8d0;">-</span>
  <button id="btnNext" onclick="goPage(currentPage + 1)" data-i18n="next">下一页</button>
  <button class="primary" onclick="refresh()" data-i18n="refresh_page">刷新本页</button>
</div>
<div class="hint" data-i18n="hint">页面不会自动刷新,请点击「手动刷新」或按 F5 获取最新排名。天梯仅统计随机房间输入 TT 的天梯模式对决;玩家密码永不在页面上显示。</div>
<script>
var I18N = {
  zh: {
    title: 'SRVPro 天梯排行', nav_intro: '使用介绍', nav_rooms: '房间列表', nav_replays: '录像下载', nav_ladder: '天梯排行', nav_deck_stats: '卡组胜率',
    search_ph: '输入玩家 ID 搜索其战绩', search: '搜索', clear: '清空',
    tab_total: '总战绩', tab_month: '当月战绩', refresh: '手动刷新', month_label: '月份',
    th_rank: '排名', th_player: '玩家', th_total_points: '总等级分', th_month_points: '月等级分', th_win: '胜', th_lose: '负', th_diff: '胜负差', th_winrate: '胜率',
    prev: '上一页', next: '下一页', refresh_page: '刷新本页',
    hint: '页面不会自动刷新,请点击「手动刷新」或按 F5 获取最新排名。天梯仅统计随机房间输入 TT 的天梯模式对决;玩家密码永不在页面上显示。',
    no_data: '暂无数据', load_fail: '加载失败',
    page_info: '第 %p% / %t% 页,共 %n% 个玩家', search_info: '关键词「%s%」:共 %n% 条匹配 · ',
    privacy_hint: '排名后30%的玩家ID将在总榜上隐藏'
  },
  ja: {
    title: 'SRVPro ランキング', nav_intro: '使用説明', nav_rooms: 'ルーム一覧', nav_replays: 'リプレイ', nav_ladder: 'ランキング', nav_deck_stats: 'デッキ勝率',
    search_ph: 'プレイヤーIDで戦績を検索', search: '検索', clear: 'クリア',
    tab_total: '通算戦績', tab_month: '今月', refresh: '更新', month_label: '月',
    th_rank: '順位', th_player: 'プレイヤー', th_total_points: '総レート', th_month_points: '月レート', th_win: '勝', th_lose: '敗', th_diff: '得失', th_winrate: '勝率',
    prev: '前へ', next: '次へ', refresh_page: '更新',
    hint: '自動更新はありません。「更新」またはF5で最新のランキングを表示します。ランクマッチ(TT)のみ集計。パスワードは表示されません。',
    no_data: 'データなし', load_fail: '読み込み失敗',
    page_info: '%p% / %t% ページ(全 %n% 人)', search_info: '「%s%」: 全 %n% 件一致 · ',
    privacy_hint: 'ランキング下位30%のプレイヤーIDは総合ランキングで非表示になります'
  },
  en: {
    title: 'SRVPro Ladder Ranking', nav_intro: 'Usage Guide', nav_rooms: 'Rooms', nav_replays: 'Replays', nav_ladder: 'Ladder', nav_deck_stats: 'Deck Rates',
    search_ph: 'Search player stats by ID', search: 'Search', clear: 'Clear',
    tab_total: 'Total', tab_month: 'Monthly', refresh: 'Refresh', month_label: 'Month',
    th_rank: 'Rank', th_player: 'Player', th_total_points: 'Total', th_month_points: 'Month', th_win: 'W', th_lose: 'L', th_diff: 'Diff', th_winrate: 'Win Rate',
    prev: 'Prev', next: 'Next', refresh_page: 'Refresh',
    hint: 'No auto refresh. Click "Refresh" or press F5 for the latest ranking. Only ladder (TT) duels count; passwords are never shown.',
    no_data: 'No data', load_fail: 'Load failed',
    page_info: 'Page %p% / %t% (Total %n% players)', search_info: '"%s%": %n% matches · ',
    privacy_hint: 'Player IDs in the bottom 30% of rankings will be hidden on the overall leaderboard'
  },
  ko: {
    title: 'SRVPro 랭킹', nav_intro: '사용 가이드', nav_rooms: '룸 목록', nav_replays: '리플레이', nav_ladder: '랭킹', nav_deck_stats: '덱 승률',
    search_ph: '플레이어 ID로 전적 검색', search: '검색', clear: '초기화',
    tab_total: '통산 전적', tab_month: '이번 달', refresh: '새로고침', month_label: '월',
    th_rank: '순위', th_player: '플레이어', th_total_points: '총 점수', th_month_points: '월 점수', th_win: '승', th_lose: '패', th_diff: '득실', th_winrate: '승률',
    prev: '이전', next: '다음', refresh_page: '새로고침',
    hint: '자동 새로고침되지 않습니다. 「새로고침」 또는 F5로 최신 랭킹을 확인하세요. 랭크 매치(TT)만 집계. 비밀번호는 표시되지 않습니다.',
    no_data: '데이터 없음', load_fail: '로드 실패',
    page_info: '%p% / %t% 페이지(총 %n%명)', search_info: '「%s%」: %n%건 일치 · ',
    privacy_hint: '하위 30% 순위의 플레이어 ID는 전체 랭킹에서 숨겨집니다'
  }
};
var lang = 'zh';
var LANG_NAME = { zh: '中文', ja: '日本語', en: 'English', ko: '한국어' };
(function () {
  var q = new URLSearchParams(location.search);
  var L = q.get('L');
  if (L === 'ja' || q.has('jp')) lang = 'ja';
  else if (L === 'en' || q.has('en')) lang = 'en';
  else if (L === 'ko' || q.has('kr')) lang = 'ko';
})();
function t(key) { var d = I18N[lang] || I18N.zh; return d[key] !== undefined ? d[key] : (I18N.zh[key] !== undefined ? I18N.zh[key] : key); }
function toggleLangMenu(ev) {
  if (ev) ev.stopPropagation();
  document.getElementById('langMenu').classList.toggle('open');
}
document.addEventListener('click', function (e) {
  var menu = document.getElementById('langMenu');
  if (menu && !menu.parentElement.contains(e.target)) menu.classList.remove('open');
});
function applyLang() {
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : lang;
  document.title = t('title');
  document.getElementById('langLabel').textContent = LANG_NAME[lang] || '中文';
  document.querySelectorAll('[data-i18n]').forEach(function (el) { el.textContent = t(el.getAttribute('data-i18n')); });
  document.querySelectorAll('[data-i18n-ph]').forEach(function (el) { el.placeholder = t(el.getAttribute('data-i18n-ph')); });
  document.querySelectorAll('.lang-menu .lbtn').forEach(function (b) { b.className = 'lbtn' + (b.getAttribute('data-lang') === lang ? ' active' : ''); });
  document.querySelectorAll('a[data-i18n^="nav_"]').forEach(function (el) {
    var url = new URL(el.getAttribute('href'), location.href);
    url.searchParams.delete('L'); url.searchParams.delete('jp'); url.searchParams.delete('en'); url.searchParams.delete('kr');
    if (lang !== 'zh') url.searchParams.set('L', lang);
    el.href = url.pathname.split('/').pop() + url.search;
  });
  document.getElementById('tabTotal').className = currentType === 'total' ? 'active' : '';
  document.getElementById('tabMonth').className = currentType === 'month' ? 'active' : '';
  refresh();
}
function switchLang(code) {
  lang = code;
  var url = new URL(location.href);
  url.searchParams.delete('L'); url.searchParams.delete('jp'); url.searchParams.delete('en'); url.searchParams.delete('kr');
  if (code === 'ja') url.searchParams.set('L', 'ja');
  else if (code === 'en') url.searchParams.set('L', 'en');
  else if (code === 'ko') url.searchParams.set('L', 'ko');
  history.replaceState(null, '', url.toString());
  document.getElementById('langMenu').classList.remove('open');
  applyLang();
}
let currentPage = 1;
const pageSize = 50;
let searchKeyword = '';
let currentType = 'total';
let rankingBasis = null;
let selectedMonth = getCurrentMonthKey();
function getCurrentMonthKey() {
  const now = new Date();
  return now.getFullYear() + String(now.getMonth() + 1).padStart(2, '0');
}
function fillMonthOptions() {
  const select = document.getElementById('monthSelect');
  if (!select) return;
  const months = [];
  const now = new Date();
  for (let i = 0; i < 12; i++) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    const key = d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0');
    months.push(key);
  }
  select.innerHTML = months.map(function (m) {
    return '<option value="' + m + '">' + m.slice(0, 4) + '-' + m.slice(4) + '</option>';
  }).join('');
  select.value = selectedMonth;
  select.onchange = function () {
    selectedMonth = select.value;
    if (currentType === 'month') refresh();
  };
}
function doSearch() {
  searchKeyword = document.getElementById('searchInput').value.trim();
  currentPage = 1;
  refresh();
}
function clearSearch() {
  document.getElementById('searchInput').value = '';
  searchKeyword = '';
  currentPage = 1;
  refresh();
}
function setType(type) {
  currentType = type;
  document.getElementById('tabTotal').className = type === 'total' ? 'active' : '';
  document.getElementById('tabMonth').className = type === 'month' ? 'active' : '';
  refresh();
}
function getRankingBasisColumn() {
  if (rankingBasis === 'diff') return 'diff';
  if (rankingBasis === 'winRate') return 'winRate';
  return currentType === 'month' ? 'monthPoints' : 'totalPoints';
}
function updateRankingBasisStyle() {
  var column = getRankingBasisColumn();
  document.querySelectorAll('[data-ranking-column]').forEach(function (el) {
    el.classList.toggle('ranking-basis', el.getAttribute('data-ranking-column') === column);
  });
}
document.getElementById('tabTotal').onclick = function () { setType('total'); };
document.getElementById('tabMonth').onclick = function () { setType('month'); };
async function refresh() {
  try {
    const monthParam = currentType === 'month' ? '&month=' + encodeURIComponent(selectedMonth) : '';
    const rankingBasisParam = rankingBasis ? '&rankingBasis=' + encodeURIComponent(rankingBasis) : '';
    const res = await fetch('/api/ladder?type=' + currentType + '&t=' + Date.now() + '&page=' + currentPage + '&pageSize=' + pageSize + '&search=' + encodeURIComponent(searchKeyword) + monthParam + rankingBasisParam);
    const data = await res.json();
    if (data.rankingBasis) rankingBasis = data.rankingBasis;
    updateRankingBasisStyle();
    const total = data.total || 0;
    const tbody = document.getElementById('tbody');
    tbody.innerHTML = '';
    const list = data.ladder || [];
    if (!list.length) {
      const tr = document.createElement('tr');
      tr.innerHTML = '<td colspan="8">' + t('no_data') + '</td>';
      tbody.appendChild(tr);
    }
    for (let i = 0; i < list.length; i++) {
      const u = list[i];
      const tr = document.createElement('tr');
      if (i < 3) tr.className = 'top' + (i + 1);
      const showName = (total > 0 && (u.rank / total < 0.7 || searchKeyword !== '')) ? u.name : '******';
      const totalPoints = Number(u.duelPoints || 1000);
      const monthPoints = Number(u.monthDuelPoints || 1000);
      const rankingColumn = getRankingBasisColumn();
      tr.innerHTML = '<td>' + u.rank + '</td><td>' + showName + '</td><td class="' + (rankingColumn === 'totalPoints' ? 'ranking-basis' : '') + '">' + totalPoints + '</td><td class="' + (rankingColumn === 'monthPoints' ? 'ranking-basis' : '') + '">' + monthPoints + '</td><td>' + u.wins + '</td><td>' + u.losses + '</td><td class="' + (rankingColumn === 'diff' ? 'ranking-basis' : '') + '">' + u.diff + '</td><td class="' + (rankingColumn === 'winRate' ? 'ranking-basis' : '') + '">' + (u.wins + u.losses ? ((u.wins / (u.wins + u.losses)) * 100).toFixed(2) : 0) + '%</td>';
      tbody.appendChild(tr);
    }
    const totalPages = Math.max(1, Math.ceil(total / pageSize));
    let info = '';
    if (searchKeyword) {
      info += t('search_info').replace('%s%', searchKeyword).replace('%n%', total);
    }
    info += t('page_info').replace('%p%', currentPage).replace('%t%', totalPages).replace('%n%', total);
    document.getElementById('pageInfo').textContent = info;
    document.getElementById('btnPrev').disabled = currentPage <= 1;
    document.getElementById('btnNext').disabled = currentPage >= totalPages;
  } catch (e) {
    document.getElementById('tbody').innerHTML = '<tr><td colspan="8">' + t('load_fail') + ': ' + e + '</td></tr>';
  }
}
function goPage(p) {
  if (p < 1) return;
  currentPage = p;
  refresh();
}
fillMonthOptions();
applyLang();
</script>
</body>
</html>
