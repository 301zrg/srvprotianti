name: CI

# Isolated checks only: no job reads production configuration, credentials or
# connects to a database. Real PostgreSQL, browser UI scripts and PM2/server
# acceptance stay manual entries (docs/DEVELOPMENT_WORKFLOW.md#测试分类与入口).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Generated JavaScript is committed; it must match the CoffeeScript/TypeScript sources.
      - run: npm run build && git diff --exit-code
      - run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run test:ops

  release-monitor:
    # The monitor and coordinator run on Windows; several tests drive real Windows PowerShell 5.1.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run test:release-monitor
